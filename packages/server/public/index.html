<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kloon · 把任意网页还原成代码</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2318191b'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23ff4a1f'/%3E%3C/svg%3E" />
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="/base.css" />
<style>
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
@media (max-width: 720px) {
    .bar-in { gap: 10px; min-height: 52px; }
    .bar-right .meta { display: none; }
    .bar .who { max-width: 88px; }
    .links button, .quiet { padding: 8px 9px; }
  }
.wordmark { font-size: var(--step-lead); font-weight: 600; letter-spacing: -0.04em; text-decoration: none; }
.links { display: flex; gap: 4px; }
.links button, .quiet {
    padding: 8px 12px; border-radius: var(--radius); color: var(--muted);
    font-size: var(--step-small); font-weight: 500;
    transition: color .15s, background-color .15s;
  }
.links button:hover, .quiet:hover { color: var(--ink); background: var(--surface-2); }
.links button.active { color: var(--ink); background: var(--surface-2); }
.who { font-size: var(--step-small); color: var(--muted); }
.banner {
    display: flex; align-items: center; gap: 12px;
    margin: var(--margin) var(--margin) 0; padding: 14px 16px;
    background: var(--surface); border-left: 3px solid var(--accent);
    font-size: var(--step-small);
  }
.banner[hidden] { display: none; }
main { padding: 0 var(--margin); }
.grid { display: grid; grid-template-columns: minmax(0, var(--ledger)) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
/* only very wide screens can afford a reserved lane for the hover preview;
     below that the ledger and the detail share the width (and the preview stays off) */
  @media (min-width: 1600px) { .grid { grid-template-columns: minmax(0, var(--ledger)) 380px minmax(0, 1fr); } }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
/* ---------- first screen: the product performing ---------- */
  .intro { padding: clamp(40px, 7vw, 96px) 0 clamp(28px, 4vw, 48px); max-width: 34ch; }
.intro h1 { font-size: var(--step-head); }
.intro p { margin-top: 18px; color: var(--ink); font-size: var(--step-body); max-width: 42ch; }
/* the working control, at real interface size */
  [data-ui] { border-radius: var(--radius); }
.capture { background: var(--surface); padding: 18px; display: grid; gap: 14px; }
.capture-row { display: flex; gap: 10px; flex-wrap: wrap; }
.capture label { display: grid; gap: 6px; font-size: var(--step-small); color: var(--muted); }
.capture .grow { flex: 1 1 240px; min-width: 0; }
.capture .grow input { width: 100%; }
.capture .opts { display: flex; gap: 18px; flex-wrap: wrap; font-size: var(--step-small); color: var(--muted); }
.capture .opts label { display: flex; align-items: center; gap: 8px; }
  /* ---------- page frame: list / new / detail / admin share one router outlet ---------- */
  #page { max-width: 1180px; margin: 0 auto; padding: 0 var(--margin) clamp(40px, 6vw, 80px); }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: clamp(24px, 4vw, 48px) 0 20px; }
  .page-head h1 { font-size: clamp(2rem, 4.8vw, 6rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-head .action { text-decoration: none; }
  .page-note { margin: 12px 0 0; color: var(--muted); font-size: var(--step-body); max-width: 62ch; }
  .head-actions { display: flex; align-items: center; gap: 16px; }
  .back { display: inline-block; color: var(--muted); font-size: var(--step-small); text-decoration: none; }
  .wrap-any { overflow-wrap: anywhere; }
  .frame.auto { aspect-ratio: auto; }
  .frame.auto img { height: auto; }
  .back:hover { color: var(--ink); }

  /* ---------- list: one row per task, patched in place instead of re-rendered ---------- */
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .task-row {
    display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 4px 18px; align-items: center;
    padding: 12px; border-radius: var(--radius); background: var(--surface); color: inherit; text-decoration: none;
    transition: background-color .15s ease;
  }
  .task-row:hover { background: var(--surface-2); }
  .task-row .thumb { grid-row: 1 / span 2; width: 104px; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); }
  .task-row .thumb:empty { background: none; }
  .task-row .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .task-row .name { font-size: var(--step-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row .kind { color: var(--muted); font-size: var(--step-small); font-variant-numeric: tabular-nums; }
  .task-row .metric { grid-column: 3; grid-row: 1 / span 2; text-align: right; font-variant-numeric: tabular-nums; }
  .task-row .metric b { display: block; font-size: var(--step-body); font-weight: 600; }
  .task-row .metric span { color: var(--muted); font-size: var(--step-small); }
  .task-row { position: relative; overflow: hidden; }
  .row-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--surface-2); }
  .row-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
  @media (max-width: 640px) {
    .task-row { grid-template-columns: 72px minmax(0, 1fr); }
    .task-row .thumb { width: 72px; }
    .task-row .metric { grid-column: 2; grid-row: 3; text-align: left; display: flex; gap: 10px; align-items: baseline; }
  }

  /* ---------- progress: a running task shows motion instead of a blinking screen ---------- */
  .progress { height: 4px; background: var(--surface-2); border-radius: var(--radius); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
  .progress-note { margin: 12px 0 0; color: var(--muted); font-size: var(--step-small); font-variant-numeric: tabular-nums; }

  /* ---------- streamed log: lines are appended, never re-rendered ---------- */
  .log-line { display: block; animation: lineIn .3s cubic-bezier(.2, .7, .2, 1); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .form-actions { display: flex; align-items: center; gap: 20px; }
  .form-actions .quiet { text-decoration: none; }
  .auth-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
  @media (max-width: 900px) { .auth-wrap { grid-template-columns: 1fr; } }

/* ---------- detail: input half / output half, then the figure bars ---------- */
.detail-block { margin-bottom: 18px; background: var(--surface-2); border-radius: var(--radius); padding: clamp(16px, 2vw, 24px); }
.detail-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-head h3 { font-size: var(--step-lead); word-break: break-all; }
.detail-head .id { color: var(--muted); font-size: var(--step-small); font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .halves { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2px; background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-top: 20px; }
.facts div { background: var(--surface); padding: 14px 16px; }
.facts div:nth-child(even) { background: var(--surface-2); }
.facts dt { color: var(--muted); font-size: var(--step-small); }
.facts dd { margin: 6px 0 0; font-size: var(--step-body); font-variant-numeric: tabular-nums; }
/* ---------- runs: banded two-ended rows ---------- */
  .run { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; }
.run:nth-child(even) { background: var(--surface-2); }
.run-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: baseline; }
.run-head .title { font-size: var(--step-body); font-weight: 500; }
.run-head .when { grid-column: 1; color: var(--muted); font-size: var(--step-small); }
.run-head .verdict { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: var(--step-small); }
.run-body { margin-top: 14px; display: grid; gap: 10px; }
.run-links { display: flex; flex-wrap: wrap; gap: 8px; }
.run-links a { padding: 6px 10px; background: var(--surface-2); border-radius: var(--radius); font-size: var(--step-small); text-decoration: none; color: var(--muted); transition: color .15s; }
.run .run:nth-child(odd) .run-links a { background: var(--surface); }
.run-links a:hover { color: var(--ink); }
/* a run's diff table is a real table: it keeps its own lines */
  .entries { width: 100%; border-collapse: collapse; font-size: var(--step-small); }
.entries th, .entries td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.entries th { color: var(--muted); font-weight: 500; }
.entries td.sev { color: var(--accent); font-variant-numeric: tabular-nums; }
/* progress log is literal program output */
  /* taste-skill-ignore: build/capture logs are real code output, monospace is correct here */
  .log {
    margin: 0; padding: 14px; background: var(--bg); border-radius: var(--radius);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--step-small); line-height: 1.6; color: var(--muted);
    max-height: 240px; overflow: auto; white-space: pre-wrap;
  }
/* ---------- admin: real tables ---------- */
  .admin table { width: 100%; border-collapse: collapse; font-size: var(--step-small); }
.admin th, .admin td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.admin th { color: var(--muted); font-weight: 500; }
.admin tr:nth-child(even) td { background: var(--surface); }
.admin .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
.admin-forms { display: grid; gap: 10px; margin: 16px 0 28px; }
.admin-forms .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
/* ---------- auth (visitor's first screen) ---------- */
  .auth h1 { font-size: clamp(2.5rem, 4.8vw, 4.25rem); }
  .frame.auto { aspect-ratio: auto; }
  .frame.auto img { height: auto; }
  .auth { max-width: 420px; margin: clamp(28px, 7vw, 80px) 0; display: grid; gap: 26px; }
.auth form { display: grid; gap: 12px; }
.auth .swap { justify-self: start; color: var(--muted); font-size: var(--step-small); text-decoration: underline; text-underline-offset: 3px; }
.auth .swap:hover { color: var(--ink); }
.auth details { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; }
.auth summary { cursor: pointer; color: var(--muted); font-size: var(--step-small); }
.auth summary:hover { color: var(--ink); }
.auth details form { margin-top: 12px; }
.proof { display: grid; gap: 22px; }
.ready .mask > span { transform: translateY(0); }
</style>
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>
<noscript><p style="margin:0;padding:16px var(--margin);background:var(--surface);color:var(--ink)">控制台需要 JavaScript 才能运行。想先了解它能做什么，<a href="/" style="color:var(--accent)">看首页</a>。</p></noscript>

<header class="bar">
  <div class="bar-in">
    <a class="wordmark" href="/">Kloon</a>
    <nav class="links" aria-label="主要">
      <button id="tab-tasks" class="active">任务</button>
      <button id="tab-admin" hidden>管理</button>
    </nav>
    <div class="bar-right">
      <span class="meta" id="health"></span>
      <span class="who" id="whoami" title=""></span>
      <button class="quiet" id="logout" hidden>退出</button>
    </div>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main id="main">
  <div id="page"><p class="empty" style="padding:48px var(--margin)">正在载入…</p></div>
</main>

<script>
  const $ = (s) => document.querySelector(s)
  const $$ = (s) => Array.from(document.querySelectorAll(s))
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('zh-CN', { hour12: false }) }
  const fmtBytes = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? (n / 1024).toFixed(0) + ' KB' : (n || 0) + ' B')
  const fmtDuration = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : (ms || 0) + 'ms')
  const STATUS = { queued: '排队中', running: '进行中', done: '完成', failed: '失败' }
  const VSTATUS = { queued: '排队中', running: '验证中', done: '完成', failed: '失败' }
  const DECISION = { pass: '通过', continue: '继续迭代', escalate: '升级诊断', 'stagnant-stop': '停滞终止', 'cap-stop': '轮次上限' }

  // dev-only demo mode: renders the console with real captured artifacts, no API
  const DEMO = new URLSearchParams(location.search).has('demo') &&
    ['localhost', '127.0.0.1', '::1'].includes(location.hostname)

  const state = { me: null, tasks: [], selected: null, view: 'tasks' }
  // sessions live in an httpOnly cookie: the console never handles a token
  function api(path, init = {}) {
    return fetch(path, { credentials: 'same-origin', ...init, headers: { ...(init.headers || {}) } })
  }
  function banner(msg) {
    const el = $('#banner')
    el.textContent = msg || ''
    el.hidden = !msg
  }
  function upsert(task) { const i = state.tasks.findIndex((t) => t.id === task.id); if (i >= 0) state.tasks[i] = task; else state.tasks.unshift(task) }

  // ---------- demo fixtures (real output of the toolchain, see public/demo/README.txt) ----------
  const demoVariant = (id, source, status, ago, metrics) => ({
    id, ownerId: 'demo', status,
    createdAt: new Date(Date.now() - ago * 60000).toISOString(), updatedAt: new Date().toISOString(),
    input: { type: 'url', source },
    options: { viewports: [1440, 768, 375] },
    progress: [{ at: new Date().toISOString(), message: `viewport 1440: ${status === 'done' ? 'done' : 'loading'}` }],
    loop: { round: 1, history: [], escalated: false },
    verifications: [], generations: [],
    result: status === 'done' ? {
      snapshotDir: '', title: source.replace('https://', ''), viewports: [1440, 768, 375],
      screenshots: { '1440': 'demo/capture.jpg', '768': 'demo/capture-768.jpg' }, assetsOk: 12, assetsFailed: 1, dynamicRegions: 0,
      dismissed: 0, domNodes: 640, durationMs: 4100,
    } : undefined,
    sizeBytes: status === 'done' ? 2400000 : 0,
  })

  const DEMO_TASKS = [
    {
      id: 'demo-20261014-1204', ownerId: 'demo', status: 'done',
      createdAt: new Date(Date.now() - 42 * 60000).toISOString(), updatedAt: new Date().toISOString(),
      input: { type: 'url', source: 'https://fixture.local/pricing' },
      options: { viewports: [1440, 768, 375] },
      progress: [{ at: new Date().toISOString(), message: 'viewport 1440: done' }],
      loop: { round: 2, history: [{ ssim: 0.9997, pixelDiffPct: 0.03 }], escalated: false },
      verifications: [{
        id: 'demo-v1', round: 1, status: 'done', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        repro: { type: 'zip', source: 'kloon-repro.zip' }, reproDir: '', progress: [],
        result: {
          metrics: { ssim: 0.9997, pixelDiffPct: 0.03, dynamicAreaPct: 0 },
          decision: 'pass', entries: 2, durationMs: 4200,
          topEntries: [
            { severity: 0.7, element: 'button.cta', property: 'boxShadow', expected: 'rgba(99,102,241,.4) 0 4px 14px', actual: 'none' },
            { severity: 0.2, element: 'button.cta', property: 'borderRadius', expected: '12px', actual: '8px' },
          ],
          report: 'report.html', heatmaps: ['diffs/r1/heatmap-1440.png'],
        },
      }],
      generations: [],
      result: { snapshotDir: '', title: 'Fixture · 定价页', viewports: [1440, 768, 375], screenshots: { '1440': 'demo/capture.jpg', '768': 'demo/capture-768.jpg' }, assetsOk: 41, assetsFailed: 3, dynamicRegions: 0, dismissed: 1, domNodes: 1873, durationMs: 6100 },
      sizeBytes: 18432000,
    },
    {
      id: 'demo-20261014-1132', ownerId: 'demo', status: 'running',
      createdAt: new Date(Date.now() - 3 * 60000).toISOString(), updatedAt: new Date().toISOString(),
      input: { type: 'url', source: 'https://fixture.local/landing' },
      options: { viewports: [1440] },
      progress: [
        { at: new Date().toISOString(), message: 'viewport 1440: loading' },
        { at: new Date().toISOString(), message: 'dynamic: 34 regions @1440' },
        { at: new Date().toISOString(), message: 'assets: 314 ok, 495 failed' },
      ],
      loop: { round: 0, history: [], escalated: false },
      verifications: [], generations: [],
      result: undefined, sizeBytes: 0,
    },
    demoVariant('demo-20261014-1055', 'https://fixture.local/hero', 'done', 96),
    demoVariant('demo-20261014-1021', 'https://fixture.local/pricing-table', 'done', 152),
    demoVariant('demo-20261014-0958', 'https://fixture.local/docs', 'failed', 205),
  ]

  // ---------- motion ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  function revealMasked() {
    requestAnimationFrame(() => document.body.classList.add('ready'))
  }
  function observeEntrances(root = document) {
    const nodes = root.querySelectorAll('.enter:not(.in)')
    if (reduce || !('IntersectionObserver' in window)) { nodes.forEach((n) => n.classList.add('in')); return }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (!e.isIntersecting) return
        setTimeout(() => e.target.classList.add('in'), i * 70)
        io.unobserve(e.target)
      })
    }, { rootMargin: '-40px 0px -10% 0px' })
    nodes.forEach((n) => io.observe(n))
  }
  function fillBars(root = document) {
    root.querySelectorAll('.meter i[data-pct]').forEach((el, i) => {
      const pct = el.getAttribute('data-pct')
      setTimeout(() => { el.style.width = pct + '%' }, reduce ? 0 : 120 + i * 90)
    })
  }

  // ---------- auth ----------
  function renderAuth() {
    const authHtml = `
      <div class="auth">
        <div>
          <h1 class="mask"><span>把网页读成代码。</span></h1>
          <p class="enter" style="margin-top:16px">Kloon 捕获一个可访问的页面，读出它的结构与样式，收敛到像素级一致，产出可运行的 React + Tailwind 工程。</p>
        </div>

        <form id="login-form" class="enter">
          <label for="login-email">邮箱</label>
          <input type="email" id="login-email" autocomplete="username" required />
          <label for="login-password">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" required minlength="8" />
          <button class="action" type="submit">登录</button>
          <button class="swap" type="button" id="show-register">没有账号？注册</button>
          <button class="swap" type="button" id="show-forgot">忘记密码？</button>
        </form>

        <form id="register-form" hidden>
          <label for="reg-email">邮箱</label>
          <input type="email" id="reg-email" autocomplete="username" required />
          <label for="reg-password">密码（至少 8 位）</label>
          <input type="password" id="reg-password" autocomplete="new-password" required minlength="8" />
          <button class="action" type="submit">注册</button>
          <button class="swap" type="button" id="show-login">已有账号？登录</button>
        </form>

        <form id="reset-form" hidden>
          <label for="reset-password">设置新密码（至少 8 位）</label>
          <input type="password" id="reset-password" autocomplete="new-password" required minlength="8" />
          <button class="action" type="submit">保存并登录</button>
          <button class="swap" type="button" id="reset-cancel">返回登录</button>
        </form>

        <form id="forgot-form" hidden>
          <label for="forgot-email">注册邮箱</label>
          <input type="email" id="forgot-email" autocomplete="username" required />
          <button class="action" type="submit">发送重置链接</button>
          <button class="swap" type="button" id="forgot-cancel">返回登录</button>
        </form>

        <div id="auth-notice"></div>
      </div>`

    const proofHtml = `
      <div class="proof">
        <p class="enter">不用登录就能看的东西：这是工具链自己的输出。左边是原站截图，右边是同一视口下还原页的截图，下面是两边的像素差异热力图。</p>
        <div class="halves enter">
          <figure class="enter">
            <figcaption>输入 · 原站截图</figcaption>
            <div class="frame"><img src="/demo/capture.jpg" alt="工具捕获的原站截图" width="1200" height="750" /></div>
          </figure>
          <figure class="enter">
            <figcaption>输出 · 还原页截图</figcaption>
            <div class="frame"><img src="/demo/repro.jpg" alt="还原页在相同视口下的截图" width="1200" height="750" /></div>
          </figure>
        </div>
        <figure class="band enter" style="margin-top:0">
          <figcaption>差异热力图 · 红色像素为差异位置</figcaption>
          <div class="frame"><img src="/demo/heatmap.jpg" alt="原站与还原页的像素差异热力图" width="1200" height="515" /></div>
        </figure>
        <figure class="band enter">
          <figcaption>第二个视口 · 768px 下的捕获</figcaption>
          <div class="frame auto"><img src="/demo/capture-768.jpg" alt="同一页面在 768px 视口下的捕获截图" width="900" height="1200" /></div>
        </figure>
        <div class="figures">
          <div class="figure pass enter"><b>0.9997</b><span>SSIM 结构相似度</span><div class="meter"><i data-pct="100"></i></div></div>
          <div class="figure pass enter"><b>0.03%</b><span>像素差异</span><div class="meter"><i data-pct="12"></i></div></div>
          <div class="figure enter"><b>6.1s</b><span>一轮捕获耗时</span><div class="meter"><i data-pct="61"></i></div></div>
        </div>
      </div>`

    $('#page').innerHTML = `<div class="auth-wrap">${authHtml}<div class="proof-wrap">${proofHtml}</div></div>`
    $('#whoami').textContent = ''
    $('#logout').hidden = true
    $('#tab-admin').hidden = true

    const notice = (msg, bad = false) => {
      $('#auth-notice').innerHTML = msg ? `<p class="notice${bad ? ' bad' : ''}">${esc(msg)}</p>` : ''
    }
    const show = (which) => {
      $('#login-form').hidden = which !== 'login'
      $('#register-form').hidden = which !== 'register'
      $('#reset-form').hidden = which !== 'reset'
      $('#forgot-form').hidden = which !== 'forgot'
    }

    const post = async (path, body, btn) => {
      if (btn) btn.disabled = true
      try {
        const res = await api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.error || res.statusText)
        await boot()
      } catch (err) { notice(err.message, true) } finally { if (btn) btn.disabled = false }
    }

    $('#show-register').onclick = () => { notice(''); show('register') }
    $('#show-login').onclick = () => { notice(''); show('login') }
    $('#show-forgot').onclick = () => { notice(''); show('forgot') }
    $('#forgot-cancel').onclick = () => { notice(''); show('login') }
    $('#forgot-form').onsubmit = async (e) => {
      e.preventDefault()
      const btn = e.target.querySelector('button[type=submit]')
      btn.disabled = true
      try {
        await api('/api/auth/forgot-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: $('#forgot-email').value }) })
        notice('如果这个邮箱已注册，重置链接已经发出。')
        show('login')
      } catch (err) { notice(err.message, true) } finally { btn.disabled = false }
    }
    $('#reset-cancel').onclick = () => { notice(''); history.replaceState(null, '', '/app'); show('login') }
    $('#login-form').onsubmit = (e) => { e.preventDefault(); void post('/api/auth/login', { email: $('#login-email').value, password: $('#login-password').value }, e.target.querySelector('button[type=submit]')) }
    $('#register-form').onsubmit = (e) => { e.preventDefault(); void post('/api/auth/register', { email: $('#reg-email').value, password: $('#reg-password').value }, e.target.querySelector('button[type=submit]')) }
    // links that arrive from email: ?verify=<token> and ?reset=<token>
    const params = new URLSearchParams(location.search)
    const verifyToken = params.get('verify')
    const resetToken = params.get('reset')
    if (verifyToken) {
      show('login')
      void api('/api/auth/verify-email', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: verifyToken }) })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}))
          notice(res.ok ? '邮箱已验证，现在可以登录。' : data.error || '验证链接无效或已过期。', !res.ok)
          history.replaceState(null, '', '/app')
        })
    } else if (resetToken) {
      show('reset')
      $('#reset-form').onsubmit = async (e) => {
        e.preventDefault()
        const btn = e.target.querySelector('button[type=submit]')
        btn.disabled = true
        try {
          const res = await api('/api/auth/reset-password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: resetToken, password: $('#reset-password').value }) })
          const data = await res.json().catch(() => ({}))
          if (!res.ok) throw new Error(data.error || res.statusText)
          history.replaceState(null, '', '/app')
          await boot()
        } catch (err) { notice(err.message, true) } finally { btn.disabled = false }
      }
      notice('设置一个新密码即可继续。')
    } else {
      show('login')
    }

    observeEntrances($('#page'))
    fillBars($('#page'))
    revealMasked()
  }

  // ---------- routing ----------
  //   /app             任务列表(默认)
  //   /app/new         新建任务表单
  //   /app/tasks/:id   任务详情(进行中 / 已完成)
  //   /app/admin       管理台
  // The router paints a route once and then patches it in place: a running task
  // must never rebuild the DOM (that is what made the old console flicker and
  // reload screenshots on every event).
  function currentRoute() {
    const p = (location.pathname.replace(/\/+$/, '') || '/app')
    if (p.startsWith('/app/tasks/')) {
      const id = decodeURIComponent(p.slice('/app/tasks/'.length))
      if (id) return { name: 'task', id }
    }
    if (p === '/app/new') return { name: 'new' }
    if (p === '/app/admin') return { name: 'admin' }
    return { name: 'list' }
  }
  const taskUrl = (id) => `/app/tasks/${encodeURIComponent(id)}`

  // what is currently painted, and what the last content build was based on
  const view = { name: null, id: null, sig: '' }

  function navigate(path, replace = false) {
    if (location.pathname + location.search === path) { sync(); return }
    history[replace ? 'replaceState' : 'pushState']({}, '', path)
    sync()
  }

  /** paint a route for the first time, or patch the one already on screen */
  function sync(opts = {}) {
    if (!state.me) return // the auth screen owns the page until there is a session
    const r = currentRoute()
    const fresh = r.name !== view.name || r.id !== view.id
    if (fresh || opts.force) {
      view.name = r.name
      view.id = r.id ?? null
      if (fresh) view.sig = ''
      paint(r)
      return
    }
    patch(r)
  }

  function paint(r) {
    const page = $('#page')
    if (r.name === 'list') return paintList(page)
    if (r.name === 'new') return paintNew(page)
    if (r.name === 'admin') return paintAdmin(page)
    return paintTask(page, r.id)
  }

  function patch(r) {
    if (r.name === 'list') return patchList()
    if (r.name === 'task') return patchTask()
    // /app/new and /app/admin hold user input: patching them would fight the typist
  }

  const findTask = (id) => state.tasks.find((t) => t.id === id)
  const setText = (el, text) => { if (el && el.textContent !== text) el.textContent = text }
  const setClass = (el, name) => { if (el && el.className !== name) el.className = name }
  const setWidth = (el, pct) => {
    if (!el) return
    const next = `${pct}%`
    if (el.style.width !== next) el.style.width = next
  }
  const setSrc = (img, src) => { if (img && src && img.getAttribute('src') !== src) img.src = src }

  // ---------- progress ----------
  // The worker reports free-form lines; map the stage words it prints onto a
  // monotonic bar so a running task shows motion instead of a blinking screen.
  const STAGES = [
    [/viewport .*loading|开始加载/, 8, '打开页面'],
    [/meta pass|滚动/, 26, '读取结构与样式'],
    [/dynamic:/, 40, '检测动态区域'],
    [/viewport .*done|截图/, 52, '截图'],
    [/assets:/, 66, '下载资产'],
    [/states: done/, 74, '交互态捕获'],
    [/interactions:/, 82, '交互发现'],
    [/charts:/, 88, '图表快照'],
  ]
  function progressOf(t) {
    if (t.status === 'done') return { pct: 100, label: '完成' }
    const lines = (t.progress ?? []).map((p) => p.message).join('\n')
    let pct = t.status === 'queued' ? 4 : 6
    let label = t.status === 'queued' ? '排队中' : '准备中'
    for (const [re, at, name] of STAGES) {
      if (re.test(lines) && at > pct) { pct = at; label = name }
    }
    if (t.status === 'failed') label = '已失败'
    return { pct, label }
  }

  // ---------- list ----------
  function taskRow(t) {
    const shot = t.result?.screenshots?.[String(t.result?.viewports?.[0])] ?? ''
    const metric = t.result?.metrics ?? t.verifications?.at(-1)?.result?.metrics
    const li = document.createElement('li')
    li.innerHTML = `
      <a class="task-row enter" href="${taskUrl(t.id)}" data-id="${esc(t.id)}">
        <span class="thumb">${shot ? `<img src="${esc(artifactUrl(t, shot))}" alt="${esc(t.input.source)} 的捕获截图" width="320" height="200" loading="lazy" />` : ''}</span>
        <span class="name">${esc(t.input.source)}</span>
        <span class="kind">${esc(t.id)} · ${fmtTime(t.createdAt)}</span>
        <span class="metric"><b class="state ${t.status}" data-role="status">${STATUS[t.status]}</b><span data-role="metric">${metric ? `SSIM ${metric.ssim}` : ''}</span></span>
        <span class="row-progress" data-role="row-progress" hidden><i></i></span>
      </a>`
    return li
  }

  function paintList(page) {
    page.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="mask"><span>任务</span></h1>
          <p class="page-note enter" id="list-note"></p>
        </div>
        <a class="action enter" href="/app/new" id="create-btn">新建任务</a>
      </div>
      <ul class="tasks enter" id="tasks"></ul>
      <p class="empty" id="tasks-empty" hidden>还没有任务。点上面「新建任务」开始。</p>`
    observeEntrances(page)
    fillBars(page)
    revealMasked()
    patchList()
    page.querySelector('#create-btn').onclick = (e) => { e.preventDefault(); navigate('/app/new') }
  }

  function patchList() {
    const ul = $('#tasks')
    if (!ul) return
    const known = new Map([...ul.children].map((li) => [li.dataset.id ?? li.querySelector('.task-row')?.dataset.id, li]))
    const note = $('#list-note')
    const running = state.tasks.filter((t) => t.status === 'running' || t.status === 'queued').length
    setText(note, state.tasks.length ? `共 ${state.tasks.length} 个${running ? ` · ${running} 个进行中` : ''}` : '')
    const empty = $('#tasks-empty')
    if (empty) empty.hidden = state.tasks.length > 0

    // add or move rows in order, patch the text in place (no innerHTML reset, so
    // screenshots and scroll position stay put)
    state.tasks.forEach((t, i) => {
      let li = known.get(t.id)
      if (!li) {
        li = taskRow(t)
        li.dataset.id = t.id
        const row = li.querySelector('.task-row')
        row.addEventListener('click', (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return
          e.preventDefault()
          navigate(row.getAttribute('href'))
        })
      } else {
        known.delete(t.id)
        const badge = li.querySelector('[data-role=status]')
        setText(badge, STATUS[t.status])
        setClass(badge, `state ${t.status}`)
        const metric = t.result?.metrics ?? t.verifications?.at(-1)?.result?.metrics
        const meter = li.querySelector('[data-role=metric]')
        setText(meter, metric ? `SSIM ${metric.ssim}` : '')
        const live = t.status === 'running' || t.status === 'queued'
        const rp = li.querySelector('[data-role=row-progress]')
        if (rp) {
          rp.hidden = !live
          if (live) setWidth(rp.querySelector('i'), progressOf(t).pct)
        }
        const img = li.querySelector('.thumb img')
        const shot = t.result?.screenshots?.[String(t.result?.viewports?.[0])] ?? ''
        if (shot && img) setSrc(img, artifactUrl(t, shot))
        else if (shot && !img) {
          li.querySelector('.thumb').innerHTML = `<img src="${esc(artifactUrl(t, shot))}" alt="${esc(t.input.source)} 的捕获截图" width="320" height="200" loading="lazy" />`
        }
      }
      if (ul.children[i] !== li) ul.insertBefore(li, ul.children[i] ?? null)
    })
    // rows the server no longer reports
    for (const stale of known.values()) stale.remove()
    observeEntrances(ul)
  }

  // ---------- new ----------
  function paintNew(page) {
    page.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="mask"><span>新建任务</span></h1>
          <p class="page-note enter">填一个可公开访问的地址。捕获在后台跑，可以关掉这个页面。</p>
        </div>
        <div class="head-actions enter"><a class="back" href="/app" id="cancel-btn">← 任务列表</a></div>
      </div>
      <form class="capture" id="new-task">
        <div class="capture-row enter">
          <div class="grow">
            <label for="source">页面地址</label>
            <input type="text" id="source" placeholder="https://example.com" required autofocus />
          </div>
          <label for="type">类型
            <select id="type"><option value="url">网址</option><option value="image">图片路径</option><option value="video">视频路径</option></select>
          </label>
        </div>
        <div class="capture-row enter">
          <div class="grow"><label for="viewports">视口宽度（逗号分隔）</label><input type="text" id="viewports" value="1440,768,375" /></div>
          <div class="grow"><label for="maxNodes">DOM 节点上限</label><input type="text" id="maxNodes" value="4000" /></div>
        </div>
        <div class="opts enter">
          <label><input type="checkbox" id="dynamic" checked /> 动态区域检测</label>
          <label><input type="checkbox" id="states" /> 交互态捕获（慢）</label>
        </div>
        <div class="form-actions enter">
          <button class="action enter" type="submit" id="submit">开始捕获</button>
          <span class="quiet">提交后跳到该任务的详情页。</span>
        </div>
      </form>`
    observeEntrances(page)
    revealMasked()
    page.querySelector('#cancel-btn').onclick = (e) => { e.preventDefault(); navigate('/app') }
    $('#new-task').onsubmit = async (e) => {
      e.preventDefault()
      const btn = $('#submit')
      btn.disabled = true
      try {
        const viewports = $('#viewports').value.split(',').map((s) => Number(s.trim())).filter(Boolean)
        const body = {
          type: $('#type').value,
          source: $('#source').value.trim(),
          options: { viewports, maxNodes: Number($('#maxNodes').value) || 4000, dynamic: $('#dynamic').checked, states: $('#states').checked },
        }
        if (DEMO) { demoSubmit(body.source); return }
        const res = await api('/api/tasks', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || res.statusText)
        upsert(data.task)
        navigate(taskUrl(data.task.id)) // the new task opens on its own page
      } catch (err) { banner(err.message) } finally { btn.disabled = false }
    }
  }

  // ---------- detail ----------
  // demo mode serves bundled artifacts straight from /demo/* (real captures of our own fixture)
  const artifactUrl = (t, rel) => rel.startsWith('demo/') ? '/' + rel : `/api/tasks/${t.id}/artifacts/${rel}`
  const fileUrl = (t, rel) => DEMO ? '/' + (rel.includes('heatmap') ? 'demo/heatmap.jpg' : 'demo/repro.jpg') : `/api/tasks/${t.id}/files/${rel}`

  function figures(t, metrics) {
    if (!metrics) return ''
    const pct = (v) => Math.max(2, Math.min(100, Math.round(v * 100)))
    return `<div class="figures">
      <div class="figure ${metrics.ssim >= 0.98 ? 'pass' : ''}"><b>${metrics.ssim}</b><span>SSIM 结构相似度</span><div class="meter"><i data-pct="${pct(metrics.ssim)}"></i></div></div>
      <div class="figure ${metrics.pixelDiffPct <= 2 ? 'pass' : ''}"><b>${metrics.pixelDiffPct}%</b><span>像素差异</span><div class="meter"><i data-pct="${Math.min(100, metrics.pixelDiffPct * 4)}"></i></div></div>
      ${metrics.dynamicAreaPct !== undefined ? `<div class="figure"><b>${metrics.dynamicAreaPct}%</b><span>动态区域（不参与比对）</span><div class="meter"><i data-pct="${Math.min(100, metrics.dynamicAreaPct * 2)}"></i></div></div>` : ''}
    </div>`
  }

  function renderGenerations(t) {
    const runs = [...(t.generations || [])].reverse()
    if (t.status !== 'done') return ''
    if (!runs.length) return `
      <section class="detail-block enter">
        <div class="section-head" style="margin:0 0 18px"><h2>自动生成</h2></div>
        <div class="vform">
          <button class="action" id="generate-btn">启动自动生成</button>
          <p style="margin-top:12px;color:var(--muted);font-size:var(--step-small)">agent 按 copypage skill 读取快照生成工程，每轮由服务端验证并回传差异清单。</p>
        </div>
      </section>`
    return `
      <section class="detail-block enter">
        <div class="section-head" style="margin:0 0 18px"><h2>自动生成</h2><span class="count">${runs.length} 次运行</span></div>
        <div class="stack">
          ${runs.map((g) => `
            <article class="run">
              <div class="run-head">
                <span class="title">${esc(g.agent.command)}${g.agent.model ? ' · ' + esc(g.agent.model) : ''}</span>
                <span class="verdict"><span class="state ${g.status}">${VSTATUS[g.status]}</span>${g.finalDecision ? ' · ' + esc(DECISION[g.finalDecision] || g.finalDecision) : ''}</span>
                <span class="when">${esc(g.id)} · ${fmtTime(g.createdAt)}</span>
              </div>
              ${g.error ? `<p style="color:var(--danger);font-size:var(--step-small);margin-top:12px">${esc(g.error)}</p>` : ''}
              ${g.rounds?.length ? `<div class="run-body">${g.rounds.map((r) => `<p style="font-size:var(--step-small)">第 ${r.round} 轮 · ${esc(DECISION[r.decision] || r.decision)} · SSIM ${r.metrics.ssim} · 像素差异 ${r.metrics.pixelDiffPct}%</p>`).join('')}</div>` : ''}
              ${g.progress?.length ? `<pre class="log compact">${esc(g.progress.slice(-30).map((p) => `${fmtTime(p.at)}  ${p.message}`).join('\n'))}</pre>` : ''}
            </article>`).join('')}
        </div>
      </section>`
  }

  function renderVerifications(t) {
    const runs = [...(t.verifications || [])].reverse()
    const rows = runs.map((v) => {
      const r = v.result
      const links = r ? `<div class="run-links">
          <a href="${fileUrl(t, 'verifications/' + v.id + '/' + r.report)}" target="_blank" rel="noreferrer">对比报告</a>
          ${r.heatmaps.map((h) => `<a href="${fileUrl(t, 'verifications/' + v.id + '/' + h)}" target="_blank" rel="noreferrer">热力图 ${h.match(/heatmap-(\d+)/)?.[1] ?? ''}px</a>`).join('')}
          ${r.vlmRequests ? `<a href="${fileUrl(t, 'verifications/' + v.id + '/' + r.vlmRequests)}" target="_blank" rel="noreferrer">VLM 队列</a>` : ''}
        </div>` : ''
      const entries = r?.topEntries?.length ? `<table class="entries">
          <thead><tr><th>severity</th><th>元素</th><th>属性</th><th>原站</th><th>还原</th></tr></thead>
          <tbody>${r.topEntries.map((e) => `<tr><td class="sev">${e.severity}</td><td>${esc(e.element)}</td><td>${esc(e.property)}</td><td>${esc(e.expected)}</td><td>${esc(e.actual)}</td></tr>`).join('')}</tbody>
        </table>` : ''
      return `<article class="run">
        <div class="run-head">
          <span class="title">第 ${v.round} 轮 · ${esc(v.repro.type)} ${esc(v.repro.source)}</span>
          <span class="verdict"><span class="state ${v.status}">${VSTATUS[v.status]}</span>${r ? ' · ' + esc(DECISION[r.decision] || r.decision) : ''}</span>
          <span class="when">${fmtTime(v.createdAt)}</span>
        </div>
        ${v.error ? `<p style="color:var(--danger);font-size:var(--step-small);margin-top:12px;white-space:pre-wrap">${esc(v.error)}</p>` : ''}
        <div class="run-body">${links}${entries}${v.progress.length ? `<pre class="log compact">${esc(v.progress.map((p) => `${fmtTime(p.at)}  ${p.message}`).join('\n'))}</pre>` : ''}</div>
      </article>`
    }).join('')
    const history = (t.loop?.history || []).length
      ? `<p style="color:var(--muted);font-size:var(--step-small);margin-bottom:18px">收敛历史 ${t.loop.history.map((h, i) => `r${i + 1} ${h.ssim}/${h.pixelDiffPct}%`).join(' → ')}${t.loop.escalated ? ' · 已升级诊断' : ''}</p>`
      : ''
    return `
      <section class="detail-block enter" id="verify-block">
        <div class="section-head" style="margin:0 0 18px"><h2>验证还原页</h2><span class="count">${runs.length} 轮</span></div>
        <form class="admin-forms" id="verify-form" data-ui>
          <div class="row">
            <input type="text" id="verify-path" placeholder="还原工程目录（管理员可填服务器路径）" style="flex:1 1 260px" />
            <button class="action ghost small" type="button" id="verify-path-btn">验证路径</button>
            <button class="action ghost small" type="button" id="verify-zip-btn">上传 zip 验证</button>
            <input type="file" id="verify-zip" accept=".zip" hidden />
          </div>
          <p style="color:var(--muted);font-size:var(--step-small)">构建 + 同一套探测脚本 → 像素/DOM 比对（动态区域遮罩）→ 报告 → 收敛判定。普通账号请用 zip。</p>
        </form>
        ${history}
        <div class="stack">${rows || '<p class="empty">还没有验证记录。</p>'}</div>
      </section>`
  }

  function paintTask(page, id) {
    const t = findTask(id)
    if (!t) {
      page.innerHTML = `
        <div class="page-head">
          <h1 class="mask"><span>找不到任务</span></h1>
          <div class="head-actions"><a class="back" href="/app" id="back-btn">← 任务列表</a></div>
        </div>
        <p class="empty">这个任务可能已经被删除了。</p>`
      page.querySelector('#back-btn').onclick = (e) => { e.preventDefault(); navigate('/app') }
      return
    }
    page.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="mask" title="${esc(t.input.source)}"><span>${esc(t.input.source)}</span></h1>
          <p class="page-note enter"><span class="state ${t.status}" id="task-status">${STATUS[t.status]}</span> · <span class="id">${esc(t.id)}</span></p>
        </div>
        <div class="head-actions enter">
          <a class="back" href="/app" id="back-btn">← 任务列表</a>
          <button class="action danger small" id="delete-task">删除任务</button>
        </div>
      </div>

      <div id="result-block"></div>

      <section class="detail-block enter" id="log-block">
        <div class="section-head enter" style="margin:0 0 18px"><h2>捕获过程</h2><span class="count" id="log-count"></span></div>
        <div id="progress-block">
          <div class="progress" role="progressbar" aria-label="捕获进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress-bar"></i></div>
          <p class="progress-note enter" id="progress-note">准备中</p>
        </div>
        <pre class="log enter" id="log" aria-live="polite"></pre>
      </section>

      <div id="generation-block"></div>
      <div id="verify-block-wrap"></div>`

    page.querySelector('#back-btn').onclick = (e) => { e.preventDefault(); navigate('/app') }
    $('#delete-task').onclick = async () => {
      if (!confirm('删除该任务及其全部产物？')) return
      if (DEMO) { state.tasks = state.tasks.filter((x) => x.id !== t.id); navigate('/app', true); return }
      try {
        const res = await api(`/api/tasks/${t.id}`, { method: 'DELETE' })
        if (!res.ok) throw new Error(((await res.json()) || {}).error || res.statusText)
        state.tasks = state.tasks.filter((x) => x.id !== t.id)
        navigate('/app', true)
      } catch (err) { banner(err.message) }
    }
    observeEntrances(page)
    fillBars(page)
    revealMasked()
    patchTask(true)
  }

  /** content signature: rebuild the heavy sections only when their data changed */
  const taskSig = (t) => [
    t.status,
    t.result ? 'r' : '-',
    t.verifications?.length ?? 0,
    (t.verifications ?? []).map((v) => v.status).join(','),
    t.generations?.length ?? 0,
    (t.generations ?? []).map((g) => g.status).join(','),
    !!t.error,
  ].join('|')

  function patchTask(forceContent = false) {
    const r = currentRoute()
    const t = r.name === 'task' ? findTask(r.id) : null
    if (!t) return

    // status + progress: cheap, updated on every tick
    setText($('#task-status'), STATUS[t.status])
    setClass($('#task-status'), `state ${t.status}`)
    const { pct, label } = progressOf(t)
    const bar = $('#progress-bar')
    setWidth(bar, pct)
    const track = bar?.parentElement
    if (track) track.setAttribute('aria-valuenow', String(pct))
    const elapsed = t.result?.durationMs ?? (t.startedAt ? Date.now() - new Date(t.startedAt).getTime() : null)
    const live = t.status === 'running' || t.status === 'queued'
    setText($('#progress-note'), `${label} · ${pct}%${t.status === 'running' && elapsed ? ` · ${fmtDuration(elapsed)}` : ''}${live ? ' · 跑在服务端，可以关掉页面回来看' : ''}`)

    // log: append only the lines that are new (streaming, never re-rendered)
    const log = $('#log')
    if (log) {
      const lines = (t.progress ?? []).map((p) => `${fmtTime(p.at)}  ${p.message}`)
      const painted = Number(log.dataset.count ?? '0')
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24
      const empty = typeof log.dataset.count === 'undefined'
      if (empty) log.innerHTML = ''
      if (lines.length > painted) {
        const frag = document.createDocumentFragment()
        for (const line of lines.slice(painted)) {
          const span = document.createElement('span')
          span.className = 'log-line'
          span.textContent = line + '\n'
          frag.appendChild(span)
        }
        log.appendChild(frag)
        log.dataset.count = String(lines.length)
        setText($('#log-count'), `${lines.length} 行`)
      }
      if (!lines.length && !log.textContent.trim()) {
        const span = document.createElement('span')
        span.className = 'log-line'
        span.textContent = t.status === 'done'
          ? `捕获完成 · 用时 ${fmtDuration(t.result?.durationMs ?? 0)}`
          : t.status === 'failed'
            ? '任务失败，原因见上方。'
            : '（等待进度输出…）'
        log.appendChild(span)
        log.dataset.count = '0'
      }
      if (atBottom) log.scrollTop = log.scrollHeight
    }

    // heavy content: full rebuild only when its signature changed
    const sig = taskSig(t)
    if (forceContent || view.sig !== sig) {
      view.sig = sig
      renderResultBlock(t)
      $('#generation-block').innerHTML = renderGenerations(t)
      $('#verify-block-wrap').innerHTML = renderVerifications(t)
      observeEntrances($('#result-block'))
      observeEntrances($('#verify-block-wrap'))
      fillBars($('#result-block'))
      wireGeneration(t)
      wireVerification(t)
    }
  }

  function renderResultBlock(t) {
    const el = $('#result-block')
    if (!el) return
    const r = t.result
    if (!r) {
      el.innerHTML = t.error
        ? `<section class="detail-block enter"><div class="section-head" style="margin:0 0 14px"><h2>失败原因</h2><span class="state failed">失败</span></div><pre class="log">${esc(t.error)}</pre></section>`
        : ''
      return
    }
    const vp = r.viewports?.[0] ?? t.options?.viewports?.[0] ?? 1440
    const shot = r.screenshots?.[String(vp)] ?? ''
    const lastVerify = t.verifications?.at(-1)
    const reproSrc = lastVerify ? fileUrl(t, 'verifications/' + lastVerify.id + '/repro-snap/screenshots/' + vp + '.png') : ''
    const heatSrc = lastVerify?.result?.heatmaps?.[0] ? fileUrl(t, 'verifications/' + lastVerify.id + '/' + lastVerify.result.heatmaps[0]) : ''
    const metrics = t.verifications?.at(-1)?.result?.metrics
    const vp2 = r.viewports?.[1]
    const shot2 = vp2 ? r.screenshots?.[String(vp2)] : ''
    const facts = [
      ['页面地址', `<span class="wrap-any">${esc(t.input.source)}</span>`],
      r.title ? ['页面标题', esc(r.title)] : null,
      ['状态', `<span class="state ${t.status}">${STATUS[t.status]}</span>`],
      ['视口', (r.viewports ?? t.options?.viewports ?? []).join(' / ') || '默认'],
      ['DOM 节点', r.domNodes ?? '-'],
      ['资产', `${r.assetsOk} 成功 / ${r.assetsFailed} 失败`],
      ['动态区域', `${r.dynamicRegions} 处`],
      ['自动关闭弹窗', r.dismissed],
      ['耗时', fmtDuration(r.durationMs)],
      t.worker?.pid ? ['Worker PID', t.worker.pid] : null,
      t.sizeBytes ? ['占用', fmtBytes(t.sizeBytes)] : null,
    ].filter(Boolean)
    el.innerHTML = `
      <section class="detail-block enter">
        ${shot ? `<div class="halves enter">
          <figure>
            <figcaption>输入 · 原站截图 ${vp}px</figcaption>
            <div class="frame"><img src="${artifactUrl(t, shot)}" alt="原站 ${esc(t.input.source)} 在 ${vp}px 下的捕获" width="1440" height="900" /></div>
          </figure>
          <figure>
            <figcaption>输出 · 还原页同视口</figcaption>
            <div class="frame">${reproSrc ? `<img src="${reproSrc}" alt="还原页在 ${vp}px 下的截图" width="1440" height="900" />` : '<p class="empty" style="padding:28px 16px">提交还原工程后在这里出现对照。</p>'}</div>
          </figure>
        </div>${heatSrc ? `
        <figure class="band enter">
          <figcaption>差异热力图 · 红色为像素差异，蓝色为被排除的动态区域</figcaption>
          <div class="frame"><img src="${heatSrc}" alt="原站与还原页的像素差异热力图" width="1440" height="900" /></div>
        </figure>` : ''}
        ${shot2 ? `<figure class="band enter">
          <figcaption>第二个视口 · ${vp2}px 下的捕获</figcaption>
          <div class="frame auto"><img src="${artifactUrl(t, shot2)}" alt="原站 ${esc(t.input.source)} 在 ${vp2}px 下的捕获" width="900" height="1200" /></div>
        </figure>` : ''}` : ''}
        ${figures(t, metrics)}
        <dl class="facts">${facts.map(([k, v]) => `<div class="enter"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      </section>`
  }

  function wireGeneration(t) {
    const btn = $('#generate-btn')
    if (btn) btn.onclick = async () => {
      if (DEMO) return banner('演示模式：自动生成需要服务端 --allow-agent。')
      btn.disabled = true
      try {
        const res = await api(`/api/tasks/${t.id}/generate`, { method: 'POST' })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || res.statusText)
        upsert(data.task)
        await refresh(true)
      } catch (err) { banner(err.message) } finally { btn.disabled = false }
    }
  }

  function wireVerification(t) {
    const pathInput = $('#verify-path'), pathBtn = $('#verify-path-btn'), zipBtn = $('#verify-zip-btn'), zipInput = $('#verify-zip')
    if (!pathBtn || !zipBtn) return
    const post = async (body, headers = {}) => {
      if (DEMO) throw new Error('演示模式：验证需要真实服务端。')
      const res = await api(`/api/tasks/${t.id}/verifications`, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || res.statusText)
      return data
    }
    // keep a typed path across the rebuild of this block
    pathInput.value = state.verifyPath ?? ''
    pathInput.oninput = () => { state.verifyPath = pathInput.value }
    pathBtn.onclick = async () => {
      const source = pathInput.value.trim()
      if (!source) return banner('请先填写还原工程目录。')
      pathBtn.disabled = true
      try { const data = await post(JSON.stringify({ repro: { type: 'path', source } })); upsert(data.task); await refresh(true) }
      catch (err) { banner(err.message) } finally { pathBtn.disabled = false }
    }
    zipBtn.onclick = () => zipInput.click()
    zipInput.onchange = async () => {
      const file = zipInput.files?.[0]
      if (!file) return
      zipBtn.disabled = true
      try { const data = await post(file, { 'content-type': 'application/zip', 'x-filename': file.name }); upsert(data.task); await refresh(true) }
      catch (err) { banner(err.message) } finally { zipBtn.disabled = false; zipInput.value = '' }
    }
  }

  function paintAdmin(page) {
    page.innerHTML = `
      <div class="page-head">
        <div>
          <h1 class="mask"><span>管理</span></h1>
          <p class="page-note">用户、封禁、预警与审计。</p>
        </div>
      </div>
      <div id="admin-body"></div>`
    revealMasked()
    void renderAdmin($('#admin-body'))
  }

  // ---------- admin ----------
  async function renderAdmin(el) {
    el.innerHTML = '<p class="empty">正在载入管理数据…</p>'
    if (DEMO) { el.innerHTML = '<p class="empty">演示模式：管理台需要登录真实账号。</p>'; return }
    try {
      const [users, blocks, audit, stats, warnings] = await Promise.all([
        api('/api/admin/users').then((r) => r.json()),
        api('/api/admin/blocks').then((r) => r.json()),
        api('/api/admin/audit?limit=60').then((r) => r.json()),
        api('/api/admin/stats').then((r) => r.json()),
        api('/api/admin/warnings').then((r) => r.json()),
      ])
      const s = stats
      el.innerHTML = `
        <div class="detail-block">
          <dl class="facts">
            <div><dt>用户</dt><dd>${s.users} ｜ 暂停 ${s.suspended}</dd></div>
            <div><dt>任务</dt><dd>${s.tasks}</dd></div>
            <div><dt>存储</dt><dd>${fmtBytes(s.storageBytes)}</dd></div>
            <div><dt>队列</dt><dd>${s.queue}</dd></div>
          </dl>
        </div>
        <section class="detail-block enter">
          <div class="section-head" style="margin:0 0 18px"><h2>用户</h2></div>
          <table><thead><tr><th>邮箱</th><th>角色 / 状态</th><th>套餐</th><th>用量</th><th>操作</th></tr></thead>
          <tbody>${users.users.map((u) => `
            <tr>
              <td>${esc(u.email)}<div class="sub">${esc(u.id)}</div></td>
              <td>${esc(u.role)} / ${esc(u.status)}</td>
              <td>${esc(u.plan)}</td>
              <td class="sub">任务 ${u.totals.tasks} ｜ ${fmtBytes(u.totals.storageBytes)}</td>
              <td><div class="row">
                <button class="action ghost small" data-act="toggle" data-id="${u.id}">${u.status === 'suspended' ? '恢复' : '暂停'}</button>
                <select data-act="plan" data-id="${u.id}">${['free', 'pro', 'unlimited'].map((p) => `<option value="${p}" ${p === u.plan ? 'selected' : ''}>${p}</option>`).join('')}</select>
              </div></td>
            </tr>`).join('')}</tbody></table>
        </section>
        <section class="detail-block enter">
          <div class="section-head" style="margin:0 0 18px"><h2>域名封禁</h2></div>
          <div class="admin-forms"><div class="row">
            <input type="text" id="block-value" placeholder="example.com（含子域）" style="flex:1 1 240px" />
            <button class="action small" id="block-add">封禁</button>
          </div></div>
          <table><tbody>${blocks.blocks.map((b) => `<tr><td>${esc(b.kind)}: ${esc(b.value)}</td><td class="sub">${esc(b.note ?? '')}</td><td><button class="action danger small" data-unblock="${b.id}">解除</button></td></tr>`).join('') || '<tr><td class="sub">暂无封禁</td></tr>'}</tbody></table>
        </section>
        <section class="detail-block enter">
          <div class="section-head" style="margin:0 0 18px"><h2>预警提示</h2></div>
          <div class="admin-forms"><div class="row">
            <select id="warn-user" style="flex:1 1 220px">${users.users.map((u) => `<option value="${u.id}">${esc(u.email)}</option>`).join('')}</select>
            <input type="text" id="warn-message" placeholder="给该用户发送提醒（界面 + 邮件）" style="flex:2 1 280px" />
            <button class="action small" id="warn-send">发送</button>
          </div></div>
          <table><thead><tr><th>时间</th><th>用户</th><th>类型</th><th>内容</th><th></th></tr></thead>
          <tbody>${(warnings.warnings ?? []).map((w) => `<tr>
            <td class="sub">${fmtTime(w.created_at)}</td>
            <td class="sub">${esc(users.users.find((u) => u.id === w.user_id)?.email ?? w.user_id ?? '-')}</td>
            <td>${esc(w.kind)}</td><td>${esc(w.message)}</td>
            <td><button class="action danger small" data-del-warning="${w.id}">删除</button></td></tr>`).join('') || '<tr><td class="sub">暂无预警</td></tr>'}</tbody></table>
        </section>
        <section class="detail-block enter">
          <div class="section-head" style="margin:0 0 18px"><h2>审计日志</h2></div>
          <table><thead><tr><th>时间</th><th>操作</th><th>对象</th></tr></thead>
          <tbody>${audit.entries.map((a) => `<tr><td class="sub">${fmtTime(a.at)}</td><td>${esc(a.action)}</td><td class="sub">${esc(a.actor_id ?? '-')}</td></tr>`).join('')}</tbody></table>
        </section>`

      for (const btn of el.querySelectorAll('[data-act=toggle]')) btn.onclick = async () => {
        const user = users.users.find((u) => u.id === btn.dataset.id)
        const res = await api(`/api/admin/users/${user.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: user.status === 'suspended' ? 'active' : 'suspended' }) })
        if (!res.ok) banner(((await res.json()) || {}).error || res.statusText)
        renderAdmin(el)
      }
      for (const sel of el.querySelectorAll('select[data-act=plan]')) sel.onchange = async () => {
        const res = await api(`/api/admin/users/${sel.dataset.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ plan: sel.value }) })
        if (!res.ok) banner(((await res.json()) || {}).error || res.statusText)
        renderAdmin(el)
      }
      for (const btn of el.querySelectorAll('[data-unblock]')) btn.onclick = async () => { await api(`/api/admin/blocks/${btn.dataset.unblock}`, { method: 'DELETE' }); renderAdmin(el) }
      for (const btn of el.querySelectorAll('[data-del-warning]')) btn.onclick = async () => { await api(`/api/admin/warnings/${btn.dataset.delWarning}`, { method: 'DELETE' }); renderAdmin(el) }
      $('#block-add').onclick = async () => {
        const value = $('#block-value').value.trim()
        if (!value) return
        const res = await api('/api/admin/blocks', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'domain', value }) })
        if (!res.ok) banner(((await res.json()) || {}).error || res.statusText)
        renderAdmin(el)
      }
      $('#warn-send').onclick = async () => {
        const userId = $('#warn-user').value
        const message = $('#warn-message').value.trim()
        if (!message) return banner('请填写提醒内容。')
        const res = await api('/api/admin/warnings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ userId, message }) })
        if (!res.ok) banner(((await res.json()) || {}).error || res.statusText)
        renderAdmin(el)
      }
      observeEntrances(el)
    } catch (err) {
      el.innerHTML = `<p class="empty">载入失败：${esc(err.message)}</p>`
    }
  }

  // ---------- demo mode ----------
  function demoSubmit(source) {
    const next = { ...DEMO_TASKS[1], id: 'demo-' + Date.now().toString(36), input: { type: 'url', source: source || 'https://fixture.local/landing' }, status: 'running', result: undefined, sizeBytes: 0 }
    state.tasks.unshift(next)
    navigate(taskUrl(next.id))
    setTimeout(() => {
      next.status = 'done'
      next.result = { ...DEMO_TASKS[0].result, screenshots: { '1440': 'demo/capture.jpg' }, title: 'Fixture · 新捕获' }
      next.verifications = DEMO_TASKS[0].verifications
      upsert(next)
      sync()
    }, 2600)
  }

  // ---------- boot ----------
  async function loadTasks() {
    if (DEMO) {
      if (!state.tasks.length) state.tasks = JSON.parse(JSON.stringify(DEMO_TASKS))
      $('#health').textContent = '演示数据'
      return true
    }
    const res = await api('/api/tasks')
    if (res.status === 401) return false
    const data = await res.json()
    state.tasks = data.tasks
    $('#health').textContent = `队列 ${data.queue}`
    return true
  }

  /** reload from the server, then patch what is on screen */
  async function refresh(force = false) {
    const ok = await loadTasks().catch(() => false)
    if (ok) sync({ force })
  }

  function setTabs() {
    const r = currentRoute()
    $('#tab-tasks').classList.toggle('active', r.name !== 'admin')
    $('#tab-admin').classList.toggle('active', r.name === 'admin')
  }

  async function boot() {
    if (DEMO) {
      state.me = { user: { email: 'demo@kloon.dev', role: 'user', plan: 'free' }, quota: { maxTasks: 10, maxStorageBytes: 524288000, maxGenerationsPerDay: 1, maxCapturesPerDay: 20 }, totals: { tasks: 2, storageBytes: 18432000 }, usage: { capture: 3, generate: 0 }, warnings: [] }
      $('#whoami').textContent = 'demo@kloon.dev · free'
      $('#logout').hidden = false
      $('#logout').onclick = () => { location.href = location.pathname }
      $('#tab-admin').hidden = true
      const r = currentRoute()
      if (r.name === 'admin') history.replaceState({}, '', '/app?demo=1')
      await loadTasks()
      view.name = null
      view.id = null
      setTabs()
      sync()
      revealMasked()
      return
    }
    const meRes = await api('/api/auth/me')
    if (meRes.status === 401) { state.me = null; renderAuth(); return }
    const me = await meRes.json()
    state.me = me
    $('#whoami').textContent = `${me.user.email} · ${me.user.plan}${me.user.role === 'admin' ? ' · admin' : ''}`
    $('#logout').hidden = false
    $('#tab-admin').hidden = me.user.role !== 'admin'
    $('#logout').onclick = async () => {
      await api('/api/auth/logout', { method: 'POST' })
      state.me = null
      view.name = null
      view.id = null
      await boot()
    }
    banner('')
    openStream()
    await loadTasks()
    setTabs()
    sync()
    revealMasked()
    const warnings = (me.warnings ?? []).filter((w) => !w.acknowledged)
    if (warnings.length) {
      const w = warnings[0]
      const el = $('#banner')
      el.innerHTML = `<span>注意：${esc(w.message)}</span><button class="action ghost small" id="ack-warning">知道了</button>`
      el.hidden = false
      $('#ack-warning').onclick = async () => { await api(`/api/warnings/${w.id}/ack`, { method: 'POST' }); banner(''); await refresh(true) }
    }
  }

  $('#tab-tasks').onclick = () => navigate('/app')
  $('#tab-admin').onclick = () => navigate('/app/admin')
  window.addEventListener('popstate', () => { setTabs(); sync() })

  // opened after a successful auth (a stream opened before login stays 401 and
  // the UI would never receive live updates)
  let events = null
  function openStream() {
    if (DEMO || events) return
    events = new EventSource('/api/events')
    events.addEventListener('task', (ev) => {
      upsert(JSON.parse(ev.data))
      setTabs()
      sync() // patch in place: status, progress bar, appended log lines
    })
    events.addEventListener('cleaned', () => { void refresh() })
  }

  // fallback poll: a console must converge even if the event stream is cut
  let polling = false
  setInterval(() => {
    if (DEMO || !state.me || polling) return
    polling = true
    void refresh().finally(() => { polling = false })
  }, 4000)

  // elapsed time ticks locally: no request, no repaint of anything else
  setInterval(() => {
    if (!state.me) return
    const r = currentRoute()
    if (r.name !== 'task') return
    const t = findTask(r.id)
    if (t?.status === 'running') patchTask()
  }, 1000)

  void boot().catch((err) => banner('无法连接服务：' + err.message))
</script>
</body>
