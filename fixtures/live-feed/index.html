<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dynamic Fixture</title>
<style>
  body { margin: 20px; font-family: sans-serif; }
  #clock { display: inline-block; min-width: 40px; }
  #feed li { height: 20px; }
</style>
</head>
<body>
  <h1 id="static-title">Static Title</h1>
  <div id="clock-wrap">tick: <span id="clock">0</span></div>
  <ul id="feed"></ul>
  <script>
    let n = 0
    setInterval(() => {
      n++
      document.getElementById('clock').textContent = String(n)
    }, 150)

    let items = 0
    setInterval(() => {
      items++
      const li = document.createElement('li')
      li.textContent = 'feed item ' + items
      document.getElementById('feed').appendChild(li)
    }, 300)
  </script>
</body>
</html>
