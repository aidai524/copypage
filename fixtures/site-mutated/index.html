<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CopyPage Fixture Site</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; background: #ffffff; color: #1a1a2e; }
  header { padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 20px; font-weight: 700; }
  .hero { padding: 96px 48px; text-align: center; background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%); }
  .hero h1 { font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0 0 16px; }
  button.cta {
    border: none; cursor: pointer;
    background: #6366f1; color: #ffffff;
    border-radius: 8px;
    padding: 16px 32px;
    font-size: 16px; font-weight: 600;
  }
  button.cta:hover { background: #4f46e5; }
  button.cta:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px; }
  .card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; }
  .lazy-section { min-height: 120px; padding: 48px; }
  #lazy-content { display: none; background: #fef3c7; padding: 24px; border-radius: 8px; }
  footer { padding: 24px 48px; color: #6b7280; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <div class="logo"><img src="assets/logo.png" width="32" height="32" alt="logo"> Fixture</div>
    <nav><a href="#features">Features</a>
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#6366f1"/></svg>
    </nav>
    <img class="broken" src="assets/missing-404.png" width="10" height="10" alt="">
  </header>
  <section class="hero">
    <h1>Clone me if you can</h1>
    <button class="cta">Get Started</button>
  </section>
  <section class="cards" id="features">
    <div class="card"><h3>Fast</h3><p>Pixel layer diffing.</p></div>
    <div class="card"><h3>Precise</h3><p>DOM-level comparison.</p></div>
    <div class="card"><h3>Iterative</h3><p>Converges to 1:1.</p></div>
  </section>
  <section class="lazy-section">
    <div id="lazy-content">Lazy loaded block</div>
  </section>
  <footer>© 2026 Fixture Inc.</footer>
  <div id="sales-chart" style="width:600px;height:300px"></div>
  <script>
    // simulate a Highcharts instance registry
    window.Highcharts = {
      charts: [{
        options: {
          chart: { type: 'column', renderTo: 'sales-chart' },
          title: { text: 'Monthly Sales' },
          xAxis: { categories: ['Jan', 'Feb', 'Mar'] },
          series: [{ name: 'Revenue', data: [120, 200, 150] }]
        }
      }]
    }
  </script>
  <script>
    // lazy content: appears only after user scrolls near it
    let loaded = false
    window.addEventListener('scroll', () => {
      if (loaded) return
      if (window.scrollY > 100) {
        loaded = true
        document.getElementById('lazy-content').style.display = 'block'
      }
    })
  </script>
</body>
</html>
